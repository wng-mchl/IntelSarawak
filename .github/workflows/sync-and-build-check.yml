name: Sync data and build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - run: npm ci

      # The scraper lives outside this repo, so this always falls back to
      # whatever src/data/articles.json is already committed -- this step
      # just confirms that fallback path (and the data it finds) is sane.
      - run: npm run sync-data

      - run: npm run build
